<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Troy Makina Kazakhstan background">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#1f252f" stroke-width="1"/>
    </pattern>
    <filter id="noise" x="0" y="0">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.25"/>
  <rect width="1600" height="900" filter="url(#noise)" opacity="0.05"/>
  <g fill="none" stroke="#cfd3d9" stroke-width="1.4" opacity="0.35">
    <circle cx="350" cy="420" r="320"/>
    <circle cx="1250" cy="520" r="420"/>
    <path d="M180 200l220 140-90 260-260-150z" opacity="0.4"/>
    <path d="M1120 180l300 180-140 320-330-210z" opacity="0.35"/>
  </g>
  <text x="120" y="430" fill="#e9edf1" font-family="Inter,Arial,sans-serif" font-size="120" font-weight="900" opacity="0.10" letter-spacing="-2">
    TROY MAKINA
  </text>
  <text x="180" y="540" fill="#e9edf1" font-family="Inter,Arial,sans-serif" font-size="84" font-weight="800" opacity="0.10" letter-spacing="-1">
    KAZAKHSTAN
  </text>
</svg>

